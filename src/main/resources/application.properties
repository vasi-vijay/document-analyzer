# Server
server.port=${SERVER_PORT:8080}
server.error.include-message=never

# Application
spring.application.name=document-analyzer

# Upload limits
spring.servlet.multipart.max-file-size=${APP_UPLOAD_MAX_SIZE:25MB}
spring.servlet.multipart.max-request-size=${APP_UPLOAD_MAX_SIZE:25MB}

# PostgreSQL. Defaults preserve the user's existing local database name.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vasivijay}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:docanalyzer}
spring.datasource.password=${POSTGRE_DB_PASSWORD}

# JPA and migrations
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Infrastructure endpoints
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Disable Spring AI's implicit ChatClient auto-wiring because AiModelService
# explicitly selects the configured provider (Ollama or OpenAI-compatible).
spring.ai.chat.client.enabled=false

# OpenAI API or any OpenAI-compatible endpoint (e.g. vLLM / LM Studio)
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.api-key=${OPENAI_API_KEY:local-disabled-key}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}

# Local or remote Ollama server
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:qwen2.5-coder:7b}

# Health endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# AI provider and retrieval settings
app.ai.provider=${APP_AI_PROVIDER:ollama}
app.ai.max-context-chunks=${APP_AI_MAX_CONTEXT_CHUNKS:6}
app.ai.min-lexical-score=${APP_AI_MIN_LEXICAL_SCORE:0.08}

# Document ingestion
app.ingestion.chunk-size=${APP_INGESTION_CHUNK_SIZE:1200}
app.ingestion.chunk-overlap=${APP_INGESTION_CHUNK_OVERLAP:180}
app.ingestion.max-extracted-chars=${APP_INGESTION_MAX_EXTRACTED_CHARS:2000000}

# Security: set a strong non-empty password before startup
app.security.username=${APP_SECURITY_USERNAME:admin}
app.security.password=${APP_SECURITY_PASSWORD:admin}

# File storage and upload size
app.storage.root=${APP_STORAGE_ROOT:./var/documents}
app.upload.max-bytes=${APP_UPLOAD_MAX_BYTES:26214400}
