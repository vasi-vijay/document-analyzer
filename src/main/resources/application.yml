server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
spring:
  application:
    name: document-analyzer
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_SIZE:25MB}
      max-request-size: ${APP_UPLOAD_MAX_SIZE:25MB}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vasivijay}
    username: ${SPRING_DATASOURCE_USERNAME:docanalyzer}
    password: $${POSTGRE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:local-disabled-key}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:llama3.2}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  security:
    username: ${APP_SECURITY_USERNAME:admin}
    password: ${APP_SECURITY_PASSWORD:}
  storage:
    root: ${APP_STORAGE_ROOT:./var/documents}
  upload:
    max-bytes: ${APP_UPLOAD_MAX_BYTES:26214400}
